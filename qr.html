<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Scan QR Code</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: #f5f7fa;
      font-family: 'Inter', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      color: #1a1a2e;
    }

    .card {
      background: #fff;
      border-radius: 24px;
      box-shadow: 0 4px 40px rgba(0,0,0,0.08);
      width: 100%;
      max-width: 420px;
      overflow: hidden;
    }

    .card-top {
      background: linear-gradient(135deg, #667eea, #764ba2);
      padding: 32px 28px 28px;
      text-align: center;
      color: #fff;
    }

    .card-top h1 { font-size: 1.4rem; font-weight: 700; margin-bottom: 4px; }
    .card-top p  { font-size: 13px; opacity: 0.8; }

    .qr-wrap {
      margin: 20px auto 0;
      width: 180px; height: 180px;
      background: #fff;
      border-radius: 16px;
      padding: 10px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.2);
    }
    .qr-wrap img { width: 100%; height: 100%; display: block; border-radius: 8px; }

    .card-body { padding: 24px 24px 28px; }

    .timer-label {
      text-align: center;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: #999;
      margin-bottom: 12px;
    }

    .timer-row {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-bottom: 24px;
    }

    .t-box {
      text-align: center;
      background: #f5f7fa;
      border-radius: 12px;
      padding: 10px 14px;
      min-width: 58px;
    }
    .t-num { font-size: 22px; font-weight: 700; color: #667eea; line-height: 1; display: block; }
    .t-lbl { font-size: 10px; color: #aaa; margin-top: 4px; display: block; }

    .btn-copy {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: #fff;
      border: none;
      border-radius: 14px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.15s;
      margin-bottom: 12px;
    }
    .btn-copy:hover { opacity: 0.9; transform: translateY(-1px); }

    .icon-row {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-bottom: 24px;
    }

    .icon-btn {
      width: 44px; height: 44px;
      border-radius: 50%;
      background: #f5f7fa;
      border: none;
      color: #667eea;
      font-size: 15px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s, transform 0.15s;
    }
    .icon-btn:hover { background: #ede9ff; transform: translateY(-2px); }

    .bc-section {
      background: #f9f9fc;
      border: 1px solid #ece9ff;
      border-radius: 16px;
      padding: 16px;
    }

    .bc-heading {
      font-size: 12px;
      font-weight: 700;
      color: #667eea;
      letter-spacing: 0.5px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .bc-item { margin-bottom: 10px; }
    .bc-item:last-child { margin-bottom: 0; }

    .bc-key {
      font-size: 10px;
      font-weight: 600;
      color: #aaa;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 3px;
    }

    .bc-val {
      font-size: 11px;
      color: #444;
      font-family: 'Courier New', monospace;
      word-break: break-all;
      background: #fff;
      border: 1px solid #eee;
      border-radius: 8px;
      padding: 6px 10px;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: #e8f5e9;
      color: #2e7d32;
      border-radius: 99px;
      padding: 4px 12px;
      font-size: 12px;
      font-weight: 600;
    }
    .status-dot { width: 7px; height: 7px; background: #43a047; border-radius: 50%; }

    .explorer-btn {
      display: block;
      text-align: center;
      margin-top: 12px;
      font-size: 12px;
      color: #667eea;
      font-weight: 500;
      cursor: pointer;
      text-decoration: none;
    }
    .explorer-btn:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="card">

    <div class="card-top">
      <h1>🔐 Scan QR Code</h1>
      <p>Scan or copy the link to access your file</p>
      <div class="qr-wrap">
        <img id="qrCodeImage" src="__QR_IMAGE__" alt="QR Code" />
      </div>
    </div>

    <div class="card-body">

      <div class="timer-label">Expires In</div>
      <div class="timer-row">
        <div class="t-box"><span class="t-num" id="days">0</span><span class="t-lbl">Days</span></div>
        <div class="t-box"><span class="t-num" id="hours">00</span><span class="t-lbl">Hours</span></div>
        <div class="t-box"><span class="t-num" id="minutes">00</span><span class="t-lbl">Min</span></div>
        <div class="t-box"><span class="t-num" id="seconds">00</span><span class="t-lbl">Sec</span></div>
      </div>

      <button class="btn-copy" onclick="copyLink()">
        <i class="fas fa-copy"></i> &nbsp;Copy Link
      </button>

      <div class="icon-row">
        <button class="icon-btn" title="Share" onclick="shareQR()"><i class="fas fa-share-alt"></i></button>
        <button class="icon-btn" title="Download" onclick="downloadQRImage()"><i class="fas fa-download"></i></button>
        <button class="icon-btn" title="PDF" onclick="exportAsPDF()"><i class="fas fa-file-pdf"></i></button>
        <button class="icon-btn" title="Blockchain" onclick="window.open('/blockchain','_blank')"><i class="fas fa-link"></i></button>
      </div>

      <div class="bc-section">
        <div class="bc-heading"><i class="fas fa-link"></i> Blockchain Record</div>

        <div class="bc-item">
          <div class="bc-key">Block #</div>
          <div class="bc-val">__BLOCK_INDEX__</div>
        </div>
        <div class="bc-item">
          <div class="bc-key">Block Hash</div>
          <div class="bc-val">__BLOCK_HASH__</div>
        </div>
        <div class="bc-item">
          <div class="bc-key">File SHA-256</div>
          <div class="bc-val">__ORIGINAL_SHA256__</div>
        </div>
        <div class="bc-item">
          <div class="bc-key">Chain Status</div>
          <div style="margin-top:4px">
            <span class="status-pill"><span class="status-dot"></span> __CHAIN_VALID__</span>
          </div>
        </div>

        <a class="explorer-btn" onclick="window.open('/blockchain','_blank')">
          View Blockchain Explorer →
        </a>
      </div>

    </div>
  </div>

  <script>
    const link = "__QR_LINK__";
    const accessSeconds = parseInt('__ACCESS_SECONDS__');

    function copyLink() {
      navigator.clipboard.writeText(link).then(() => {
        const btn = document.querySelector('.btn-copy');
        btn.innerHTML = '✅ &nbsp;Copied!';
        setTimeout(() => btn.innerHTML = '<i class="fas fa-copy"></i> &nbsp;Copy Link', 2000);
      });
    }

    function shareQR() {
      const img = document.getElementById("qrCodeImage");
      fetch(img.src).then(r => r.blob()).then(blob => {
        const file = new File([blob], "qr-code.png", { type: blob.type });
        if (navigator.canShare?.({ files: [file] })) navigator.share({ files: [file], title: "QR Code", url: link });
        else if (navigator.share) navigator.share({ title: "QR Link", url: link });
        else alert("Sharing not supported.");
      });
    }

    function downloadQRImage() {
      const a = document.createElement("a");
      a.href = document.getElementById("qrCodeImage").src;
      a.download = "qr-code.png"; a.click();
    }

    function exportAsPDF() {
      const img = document.getElementById("qrCodeImage");
      const win = window.open("");
      win.document.write(`<h2>Secure QR Code</h2><img src="${img.src}" width="300"/><p>${link}</p><p>Block Hash: __BLOCK_HASH__</p><p>SHA-256: __ORIGINAL_SHA256__</p>`);
      win.print();
    }

    let countdown = accessSeconds;
    function updateCountdown() {
      if (countdown <= 0) {
        document.querySelector('.card').innerHTML = `<div style="padding:60px 20px;text-align:center"><div style="font-size:48px">⏳</div><h2 style="margin-top:16px;color:#667eea">Link Expired</h2><p style="color:#999;margin-top:8px;font-size:14px">This QR code is no longer valid.</p></div>`;
        return;
      }
      document.getElementById("days").textContent = Math.floor(countdown / 86400);
      document.getElementById("hours").textContent = String(Math.floor((countdown % 86400) / 3600)).padStart(2,'0');
      document.getElementById("minutes").textContent = String(Math.floor((countdown % 3600) / 60)).padStart(2,'0');
      document.getElementById("seconds").textContent = String(countdown % 60).padStart(2,'0');
      countdown--;
    }
    updateCountdown();
    setInterval(updateCountdown, 1000);
  </script>
</body>
</html>
